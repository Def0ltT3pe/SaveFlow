server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SSE (живое обновление): без буферизации и с долгим таймаутом
    location = /api/v1/events/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API и Swagger (/api/v1/docs, /api/v1/openapi.json)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus и healthcheck
    location = /metrics { proxy_pass http://backend:8000; }
    location = /healthz { proxy_pass http://backend:8000; }

    # Хэшированная статика Vite можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой другой путь отдаёт index.html (react-router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
