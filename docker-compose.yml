name: saveflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-churn}
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные и настройки модели переживают перезапуск
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://churn:${DB_PASSWORD:-churn}@db:5432/churn
      AUTO_MIGRATE: "0"                     # миграции делает entrypoint
      SEED_ON_START: ${SEED_ON_START:-1}    # 0 — не грузить data/data.json
      DEMO_USER: ${DEMO_USER:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-admin}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Вход через OIDC (Keycloak ниже). Браузер ходит к Keycloak по адресу сервера (PUBLIC_HOST), бэкенд — по имени контейнера
      OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/saveflow
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/saveflow
      OIDC_CLIENT_ID: saveflow-panel
      OIDC_REDIRECT_URI: http://${PUBLIC_HOST:-localhost}:${APP_PORT:-8080}/api/v1/auth/oidc/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://${PUBLIC_HOST:-localhost}:${APP_PORT:-8080}/login
      OIDC_REQUIRED_ROLE: analyst
      OIDC_NAME: Keycloak
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./front
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Провайдер входа OIDC для демонстрации: realm saveflow, пользователи analyst/analyst и guest/guest (без доступа)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # токены и ключи бэкенд берёт по http://keycloak:8080
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}    # realm разрешает возврат в панель на этот адрес
    volumes:
      - ./docker/keycloak/saveflow-realm.json:/opt/keycloak/data/import/saveflow-realm.json:ro
      - ./docker/keycloak/themes/saveflow:/opt/keycloak/themes/saveflow:ro   # страница входа в стиле SaveFlow
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"

volumes:
  pgdata:
